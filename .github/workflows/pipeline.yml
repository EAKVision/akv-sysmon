name: AKV Autonomous 24-Module Engine

on:
schedule:
- cron: '0 */6 * * *' # Runs automatically every 6 hours
workflow_dispatch:

jobs:
run-pipeline:
runs-on: ubuntu-latest
steps:
  - name: Checkout Repository
    uses: actions/checkout@v3

  - name: Set up Python 3.10
    uses: actions/setup-python@v4
    with:
      python-version: '3.10'

  - name: Install System & FFmpeg Dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y ffmpeg

  - name: Execute 24-Module Master Engine
    run: python3 run_all.py

  - name: Commit & Push Vault Snapshots and Rendered Assets
    run: |
      git config --global user.name 'AKV Autonomous Bot'
      git config --global user.email 'bot@akvision.internal'
      git add staged_output/
      git commit -m "Auto-generated viral video assets & vault snapshot [GitHub Actions]" || exit 0
      git push
