name: Elite AKV 24/7 Automation

on:
  schedule:
    - cron: '0 14 * * *' # Runs daily at 14:00 UTC
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  run-modules:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt || true

      - name: Execute System Engine
        env:
          INSTAGRAM_SESSION: ${{ secrets.INSTAGRAM_SESSION }}
        run: |
          echo "$INSTAGRAM_SESSION" > session.json
          python3 run_all.py
